<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
    <title>DSH Local Build</title>
  </head>
  <body>
    <!-- ── 首帧遮罩（2026-11-05，0.5.5 用户实测）───────────────────────────
         现象：退出/登录后宿主重启，主 WebView 重新加载首页。此时 React 尚未
         挂载、logo 图片尚未下载，WKWebView 会先画出**只有文字、logo 破图/
         问号**的半成品登录页，资源到位后才"重启"成正确页面。
         用户原话：「那几行文字没问题，我指的是文字消失后进入的那个
         logo 破图的登录页，不要再出现了，或者你给遮住」。

         修法：<body> 最前面放一层**纯内联**遮罩（不依赖外部 CSS/JS/图片，
         因此不存在自身加载失败），关键资源就绪后淡出：
           ① window load（所有 img/script 加载完）→ 下一帧淡出；
           ② 兜底 2.5s 必撤（绝不永久遮挡）。
         它只在**本页自身加载期**存在，不覆盖用户认可的「正在准备」文字页
         （那是另一个文档）。 -->
    <div id="hl-first-paint-veil" aria-hidden="true">
      <div class="hlv-mark"><span class="hlv-capsule"></span><span class="hlv-ring"></span></div>
      <div class="hlv-brand">HeightLab</div>
    </div>
    <style>
      #hl-first-paint-veil {
        position: fixed; inset: 0; z-index: 2147483646;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #f2f1ed;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        transition: opacity .22s ease;
        -webkit-user-select: none; user-select: none;
      }
      #hl-first-paint-veil.hlv-out { opacity: 0; pointer-events: none; }
      #hl-first-paint-veil .hlv-mark { position: relative; width: 64px; height: 64px; margin-bottom: 20px; }
      #hl-first-paint-veil .hlv-capsule {
        position: absolute; left: 8px; top: 20px; width: 48px; height: 24px;
        border-radius: 999px; background: #1a1a1a;
        animation: hlv-float 2.4s ease-in-out infinite;
      }
      #hl-first-paint-veil .hlv-ring {
        position: absolute; left: 4px; top: 18px; width: 56px; height: 28px;
        border: 2px solid #1a1a1a; border-radius: 50%; transform: rotate(-30deg);
      }
      @keyframes hlv-float {
        0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) }
      }
      #hl-first-paint-veil .hlv-brand {
        font-size: 19px; font-weight: 600; letter-spacing: -.3px; color: #1a1a1a;
      }
    </style>
    <script>
      (function () {
        var veil = document.getElementById('hl-first-paint-veil');
        if (!veil) return;
        var done = false;
        function drop() {
          if (done) return;
          done = true;
          veil.classList.add('hlv-out');
          setTimeout(function () {
            if (veil && veil.parentNode) veil.parentNode.removeChild(veil);
          }, 260);
        }
        if (document.readyState === 'complete') {
          requestAnimationFrame(drop);
        } else {
          window.addEventListener('load', function () { requestAnimationFrame(drop); }, { once: true });
        }
        setTimeout(drop, 2500);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
