  <head>
    <meta charset="utf-8" />

    <title>HeightLab</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #f5f6f7;
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        background: #fff; border-radius: 16px;
        box-shadow: 0 8px 30px rgba(17, 17, 17, 0.06);
        padding: 48px 64px;
        display: flex; flex-direction: column; align-items: center; gap: 14px;
        min-width: 320px;
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand img { width: 34px; height: 34px; display: block; }
      .brand-name { font-size: 24px; font-weight: 700; color: #111; letter-spacing: 0.2px; }
      .slogan { font-size: 13px; color: #61666b; opacity: 0.85; }
      .loading { display: flex; gap: 6px; margin-top: 18px; }
      .loading i {
        width: 7px; height: 7px; border-radius: 50%; background: #111;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .loading i:nth-child(2) { animation-delay: 0.15s; }
      .loading i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes pulse { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }
    </style>
