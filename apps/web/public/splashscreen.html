<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HeightLab</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #f5f6f7;
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* HeightLab 2026-09-20（V30）：启动页去白卡嵌底，内容=官网 v2 口径的
         headline 打字机（主界面 EmptyHero 同款文案/参数放大版）。
         文案 SSOT=新官网 v2（宪法铁律 19）；动效参数同官网/EmptyHero
         （type 95ms / hold 2600ms / delete 42ms / gap 600ms / 初始 500ms）。 */
      .typewriter {
        max-width: min(760px, calc(100vw - 96px));
        text-align: center;
        font-size: 34px;
        font-weight: 600;
        color: #111;
        letter-spacing: 0.5px;
        line-height: 1.4;
        min-height: 1.4em; /* 行高锁定：两句长度不同也不跳行 */
        animation: hl-splash-fade 0.6s ease both;
      }
      .caret {
        display: inline-block;
        color: #999;
        animation: hl-caret 1s steps(1) infinite;
        margin-left: 2px;
      }
      @keyframes hl-caret {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes hl-splash-fade {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="typewriter"><span id="text"></span><span class="caret">▍</span></div>
    <script>
      (function () {
        var phrases = [
          '从一张产品图，到一支带货视频',
          '文案、图片、视频，电商内容一站生成'
        ]
        var TYPE_MS = 95, HOLD_MS = 2600, DELETE_MS = 42, GAP_MS = 600, START_MS = 500
        var el = document.getElementById('text')
        var phrase = 0, chars = 0, deleting = false
        function step() {
          var current = phrases[phrase] || ''
          if (!deleting) {
            chars += 1
            el.textContent = current.slice(0, chars)
            if (chars >= current.length) {
              deleting = true
              window.setTimeout(step, HOLD_MS)
              return
            }
            window.setTimeout(step, TYPE_MS)
          } else {
            chars -= 1
            el.textContent = current.slice(0, chars)
            if (chars <= 0) {
              deleting = false
              phrase = (phrase + 1) % phrases.length
              window.setTimeout(step, GAP_MS)
              return
            }
            window.setTimeout(step, DELETE_MS)
          }
        }
        window.setTimeout(step, START_MS)
      })()
    </script>
  </body>
</html>
